<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90" role="img" aria-label="Navidalia">
  <defs>
    <linearGradient id="goldWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E39B"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="treeWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CC266"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>

  <!-- ===== Emblem: reindeer head + small tree (cream outlines for dark bg) ===== -->
  <g transform="translate(8,10)">
    <!-- antlers -->
    <g fill="none" stroke="#F0D98C" stroke-width="4.5" stroke-linecap="round">
      <path d="M24 24 C18 12, 10 12, 6 4"/>
      <path d="M12 12 C6 10, 2 12, 0 8"/>
      <path d="M15 8 C12 2, 7 2, 4 0"/>
      <path d="M48 24 C54 12, 62 12, 66 4"/>
      <path d="M60 12 C66 10, 70 12, 72 8"/>
      <path d="M57 8 C60 2, 65 2, 68 0"/>
    </g>
    <!-- head -->
    <ellipse cx="36" cy="42" rx="22" ry="20" fill="#D59A5E"/>
    <!-- ears -->
    <ellipse cx="14" cy="38" rx="8" ry="5" fill="#BA7E42" transform="rotate(-25 14 38)"/>
    <ellipse cx="58" cy="38" rx="8" ry="5" fill="#BA7E42" transform="rotate(25 58 38)"/>
    <!-- muzzle -->
    <ellipse cx="36" cy="52" rx="14" ry="11" fill="#F3DDBE"/>
    <!-- eyes -->
    <circle cx="28" cy="40" r="3.2" fill="#2A1A0F"/>
    <circle cx="44" cy="40" r="3.2" fill="#2A1A0F"/>
    <circle cx="29.2" cy="39" r="1" fill="#fff"/>
    <circle cx="45.2" cy="39" r="1" fill="#fff"/>
    <!-- red nose -->
    <circle cx="36" cy="52" r="5.5" fill="#C1121F"/>
    <circle cx="34" cy="50" r="1.8" fill="#F2919A"/>
  </g>

  <!-- small Christmas tree next to head -->
  <g transform="translate(66,18)">
    <polygon points="12,0 22,16 2,16" fill="url(#treeWhite)"/>
    <polygon points="12,10 25,30 -1,30" fill="url(#treeWhite)"/>
    <rect x="9" y="30" width="6" height="7" fill="#8A5A2B"/>
    <polygon points="12,-5 14,-1 18,-1 15,2 16,6 12,3.5 8,6 9,2 6,-1 10,-1" fill="url(#goldWhite)"/>
    <circle cx="7" cy="22" r="1.6" fill="#FDF6EC"/>
    <circle cx="17" cy="24" r="1.6" fill="#F6E39B"/>
    <circle cx="12" cy="14" r="1.6" fill="#FDF6EC"/>
  </g>

  <!-- ===== Wordmark (cream + gold for red/dark header) ===== -->
  <g font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-weight="700">
    <text x="108" y="54" font-size="38" fill="#FDF6EC">Navi</text>
    <text x="190" y="54" font-size="38" fill="url(#goldWhite)">dalia</text>
    <text x="110" y="72" font-size="12" letter-spacing="3" fill="#F0D98C" font-weight="600">NAVIDAD · MÉXICO</text>
  </g>
</svg>
