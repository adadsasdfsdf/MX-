      <path d="M28 16 C10 8, 0 14, -10 2"/>
      <path d="M34 2 C26 -22, 8 -22, -2 -30"/>
      <path d="M108 44 C120 10, 142 10, 154 -16"/>
      <path d="M132 16 C150 8, 160 14, 170 2"/>
      <path d="M126 2 C134 -22, 152 -22, 162 -30"/>
    </g>
    <path d="M28 128 Q80 150 134 128 L140 150 Q80 176 22 150 Z" fill="#C1121F"/>
    <rect x="24" y="146" width="26" height="46" rx="6" fill="#C1121F"/>
    <rect x="24" y="156" width="26" height="6" fill="#9E0E18"/>
    <rect x="24" y="172" width="26" height="6" fill="#9E0E18"/>
    <ellipse cx="80" cy="110" rx="38" ry="30" fill="#EFD6B6"/>
    <circle cx="58" cy="86" r="9" fill="#2A1A0F"/>
    <circle cx="102" cy="86" r="9" fill="#2A1A0F"/>
    <circle cx="61" cy="82.5" r="3" fill="#fff"/>
    <circle cx="105" cy="82.5" r="3" fill="#fff"/>
    <circle cx="46" cy="104" r="8" fill="#F2A6AD" opacity="0.75"/>
    <circle cx="114" cy="104" r="8" fill="#F2A6AD" opacity="0.75"/>
    <circle cx="80" cy="112" r="15" fill="#C1121F"/>
    <circle cx="74" cy="106" r="5" fill="#F2919A"/>
