    <circle cx="260" cy="200" r="3" opacity="0.8"/>
    <circle cx="520" cy="250" r="3" opacity="0.7"/>
    <circle cx="700" cy="360" r="3" opacity="0.75"/>
    <circle cx="860" cy="300" r="3" opacity="0.7"/>
    <circle cx="420" cy="360" r="3" opacity="0.7"/>
