<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="Slide 5 Navidalia compra con confianza noche">
  <defs>
    <linearGradient id="s5sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A0008"/>
      <stop offset="0.5" stop-color="#780000"/>
      <stop offset="1" stop-color="#9E0E18"/>
    </linearGradient>
    <radialGradient id="s5moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6D6" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#FFF0C0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFF0C0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s5snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0E6F2"/>
      <stop offset="1" stop-color="#D8C7D0"/>
    </linearGradient>
    <linearGradient id="s5tree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E7D32"/>
      <stop offset="1" stop-color="#143E18"/>
    </linearGradient>
    <linearGradient id="s5gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E39B"/>
      <stop offset="1" stop-color="#C8992B"/>
    </linearGradient>
    <radialGradient id="s5bokeh" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4CC" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF4CC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s5bokehR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2A6AD" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#F2A6AD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s5bokehG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9BE3A5" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#9BE3A5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s5overlay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E0004" stop-opacity="0.78"/>
      <stop offset="0.5" stop-color="#2E0004" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2E0004" stop-opacity="0"/>
