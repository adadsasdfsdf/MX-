    <circle cx="340" cy="150" r="2" opacity="0.7"/>
    <circle cx="480" cy="70" r="3" opacity="0.95"/>
    <circle cx="600" cy="130" r="2" opacity="0.7"/>
    <circle cx="720" cy="80" r="2.5" opacity="0.85"/>
    <circle cx="880" cy="140" r="2" opacity="0.7"/>
    <circle cx="1000" cy="70" r="3" opacity="0.95"/>
    <circle cx="1120" cy="120" r="2" opacity="0.7"/>
    <circle cx="560" cy="200" r="2" opacity="0.65"/>
    <circle cx="760" cy="220" r="2.5" opacity="0.8"/>
