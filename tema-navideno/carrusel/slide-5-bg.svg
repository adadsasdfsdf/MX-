    <ellipse cx="110" cy="222" rx="78" ry="48" fill="#BC7D44"/>
    <rect x="48" y="252" width="22" height="56" rx="10" fill="#8A5A2B"/>
    <rect x="88" y="262" width="22" height="52" rx="10" fill="#8A5A2B"/>
    <rect x="128" y="262" width="22" height="52" rx="10" fill="#7A4A22"/>
    <rect x="166" y="252" width="22" height="56" rx="10" fill="#7A4A22"/>
    <ellipse cx="59" cy="308" rx="13" ry="6" fill="#4A2E14"/>
    <ellipse cx="99" cy="314" rx="13" ry="6" fill="#4A2E14"/>
    <ellipse cx="139" cy="314" rx="13" ry="6" fill="#4A2E14"/>
    <ellipse cx="177" cy="308" rx="13" ry="6" fill="#4A2E14"/>
