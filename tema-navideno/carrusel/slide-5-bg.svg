      <circle cx="100" cy="100" r="5" fill="#FFD88A"/>
      <circle cx="40" cy="150" r="5" fill="#FFF4CC"/>
      <circle cx="120" cy="190" r="5" fill="#FFD88A"/>
      <circle cx="80" cy="150" r="5" fill="#FFF4CC"/>
      <circle cx="30" cy="300" r="6" fill="#FFD88A"/>
      <circle cx="130" cy="300" r="6" fill="#FFF4CC"/>
      <circle cx="80" cy="260" r="6" fill="#FFD88A"/>
      <circle cx="60" cy="330" r="6" fill="#FFF4CC"/>
      <circle cx="105" cy="335" r="6" fill="#FFD88A"/>
    </g>
    <g opacity="0.6">
      <circle cx="60" cy="60" r="14" fill="url(#s5bokeh)"/>
      <circle cx="120" cy="190" r="14" fill="url(#s5bokeh)"/>
      <circle cx="30" cy="300" r="16" fill="url(#s5bokeh)"/>
      <circle cx="130" cy="300" r="16" fill="url(#s5bokeh)"/>
