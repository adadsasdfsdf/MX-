    <circle cx="420" cy="420" r="48" fill="url(#s5bokehR)"/>
    <circle cx="650" cy="300" r="70" fill="url(#s5bokeh)"/>
    <circle cx="900" cy="400" r="54" fill="url(#s5bokehG)"/>
