    <circle cx="150" cy="190" r="4" opacity="0.9"/>
    <circle cx="500" cy="160" r="3" opacity="0.8"/>
    <circle cx="720" cy="250" r="5" opacity="0.9"/>
    <circle cx="860" cy="150" r="3" opacity="0.7"/>
    <circle cx="620" cy="350" r="4" opacity="0.8"/>
    <circle cx="400" cy="310" r="3" opacity="0.75"/>
    <circle cx="1500" cy="320" r="4" opacity="0.8"/>
