    <path d="M28 128 Q80 150 134 128 L140 150 Q80 176 22 150 Z" fill="#2E7D32"/>
    <rect x="24" y="146" width="26" height="46" rx="6" fill="#2E7D32"/>
    <rect x="24" y="156" width="26" height="6" fill="#1F5E26"/>
    <rect x="24" y="172" width="26" height="6" fill="#1F5E26"/>
    <ellipse cx="80" cy="110" rx="38" ry="30" fill="#F3DDBE"/>
    <circle cx="58" cy="86" r="9" fill="#2A1A0F"/>
    <circle cx="102" cy="86" r="9" fill="#2A1A0F"/>
    <circle cx="61" cy="82.5" r="3" fill="#fff"/>
    <circle cx="105" cy="82.5" r="3" fill="#fff"/>
    <circle cx="46" cy="104" r="8" fill="#F2A6AD" opacity="0.7"/>
