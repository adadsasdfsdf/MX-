    <circle cx="45" cy="50" r="6" fill="#F23B4A"/>
    <circle cx="75" cy="110" r="6" fill="#D4AF37"/>
    <circle cx="45" cy="150" r="6" fill="#FDF6EC"/>
    <circle cx="90" cy="150" r="6" fill="#F23B4A"/>
