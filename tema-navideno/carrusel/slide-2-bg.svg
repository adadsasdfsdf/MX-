    <rect x="78" y="10" width="16" height="95" fill="#FDF6EC"/>
    <rect x="30" y="48" width="110" height="16" fill="#FDF6EC"/>
    <path d="M86 10 C70 -16, 40 -6, 86 12 C132 -6, 102 -16, 86 10 Z" fill="#FDF6EC"/>
