<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="Slide 2 Navidalia envio gratis">
  <defs>
    <linearGradient id="s2sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E0C16"/>
      <stop offset="0.55" stop-color="#C1121F"/>
      <stop offset="1" stop-color="#A50F1A"/>
    </linearGradient>
    <radialGradient id="s2glow" cx="0.7" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#F7D9A0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#F7D9A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s2snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2E4D4"/>
    </linearGradient>
    <linearGradient id="s2gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E39B"/>
      <stop offset="1" stop-color="#C8992B"/>
    </linearGradient>
    <radialGradient id="s2starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6D6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF6D6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s2bulb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4CC"/>
      <stop offset="1" stop-color="#F2B705"/>
    </radialGradient>
    <linearGradient id="s2overlay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5E0810" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="#5E0810" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5E0810" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#s2sky)"/>
  <rect width="1600" height="600" fill="url(#s2glow)"/>
  <circle cx="1180" cy="130" r="240" fill="url(#s2starGlow)"/>

  <path d="M0 460 C280 420, 560 480, 880 450 C1160 424, 1380 480, 1600 450 L1600 600 L0 600 Z" fill="#E8D7C4" opacity="0.55"/>
  <path d="M0 505 C320 465, 680 525, 1020 505 C1320 489, 1460 525, 1600 505 L1600 600 L0 600 Z" fill="url(#s2snow)"/>

  <!-- string lights -->
  <g>
    <path d="M-20 85 Q220 160 440 90 Q660 20 880 100 Q1100 170 1320 95 Q1520 30 1640 105" fill="none" stroke="#5B3A1C" stroke-width="3" opacity="0.7"/>
    <g>
      <circle cx="110" cy="128" r="8" fill="#58C169"/>
      <circle cx="280" cy="135" r="8" fill="url(#s2bulb)"/>
      <circle cx="450" cy="95" r="8" fill="#F23B4A"/>
      <circle cx="620" cy="68" r="8" fill="url(#s2bulb)"/>
      <circle cx="790" cy="70" r="8" fill="#58C169"/>
      <circle cx="960" cy="118" r="8" fill="url(#s2bulb)"/>
      <circle cx="1130" cy="140" r="8" fill="#F23B4A"/>
      <circle cx="1300" cy="98" r="8" fill="url(#s2bulb)"/>
      <circle cx="1470" cy="68" r="8" fill="#58C169"/>
