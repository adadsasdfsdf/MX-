<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="Slide 3 Navidalia gran apertura">
  <defs>
    <linearGradient id="s3sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#780000"/>
      <stop offset="0.55" stop-color="#B01020"/>
      <stop offset="1" stop-color="#C1121F"/>
    </linearGradient>
    <radialGradient id="s3glow" cx="0.5" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#F6E39B" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F6E39B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s3snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2E4D4"/>
    </linearGradient>
    <linearGradient id="s3gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E39B"/>
      <stop offset="1" stop-color="#C8992B"/>
    </linearGradient>
    <radialGradient id="s3starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6D6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFF6D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s3overlay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A0008" stop-opacity="0.74"/>
      <stop offset="0.5" stop-color="#4A0008" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4A0008" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#s3sky)"/>
