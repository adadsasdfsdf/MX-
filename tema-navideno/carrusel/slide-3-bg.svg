  <path d="M0 480 C260 430, 540 490, 840 460 C1120 434, 1360 490, 1600 460 L1600 600 L0 600 Z" fill="#E8D7C4" opacity="0.5"/>
  <path d="M0 510 C300 470, 650 525, 1000 508 C1300 492, 1450 525, 1600 508 L1600 600 L0 600 Z" fill="url(#s3snow)"/>

