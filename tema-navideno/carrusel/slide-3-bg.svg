  <g>
    <g transform="translate(260,120)"><polygon points="0,-16 5,-5 17,-5 7,2 11,14 0,6 -11,14 -7,2 -17,-5 -5,-5" fill="url(#s3gold)" opacity="0.9"/></g>
    <g transform="translate(520,80)"><polygon points="0,-12 4,-4 13,-4 5,2 8,11 0,5 -8,11 -5,2 -13,-4 -4,-4" fill="#FDF6EC" opacity="0.85"/></g>
    <g transform="translate(760,110)"><polygon points="0,-18 6,-6 19,-6 8,2 12,15 0,7 -12,15 -8,2 -19,-6 -6,-6" fill="url(#s3gold)" opacity="0.95"/></g>
    <g transform="translate(1010,70)"><polygon points="0,-12 4,-4 13,-4 5,2 8,11 0,5 -8,11 -5,2 -13,-4 -4,-4" fill="#FDF6EC" opacity="0.85"/></g>
    <g transform="translate(1250,120)"><polygon points="0,-16 5,-5 17,-5 7,2 11,14 0,6 -11,14 -7,2 -17,-5 -5,-5" fill="url(#s3gold)" opacity="0.9"/></g>
