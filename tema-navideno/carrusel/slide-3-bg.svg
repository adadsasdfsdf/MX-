    <circle cx="80" cy="112" r="15" fill="#C1121F"/>
    <circle cx="74" cy="106" r="5" fill="#F2919A"/>
    <path d="M66 128 Q80 142 94 128" fill="none" stroke="#8A5A2B" stroke-width="4" stroke-linecap="round"/>
