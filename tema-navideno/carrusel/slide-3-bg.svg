    <ellipse cx="139" cy="314" rx="13" ry="6" fill="#5B3A1C"/>
    <ellipse cx="177" cy="308" rx="13" ry="6" fill="#5B3A1C"/>
    <ellipse cx="80" cy="90" rx="62" ry="56" fill="#B9793E"/>
    <ellipse cx="30" cy="70" rx="20" ry="12" fill="#9E6531" transform="rotate(-28 30 70)"/>
