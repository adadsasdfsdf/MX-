    <rect x="24" y="146" width="26" height="46" rx="6" fill="url(#s3gold)"/>
    <ellipse cx="80" cy="110" rx="38" ry="30" fill="#F3DDBE"/>
    <circle cx="58" cy="86" r="9" fill="#2A1A0F"/>
